<script language="javascript">

vPTest = 1;

vDimH = 5;

vDimV = 5;

vMots = '';

vLast = 1;


function icolor(theID)
{
var theTest1 = theID.substr(5,3);

if (theTest1 == '000') {theTest1 = 'z';}
var theTest2 = theID.substr(8,3);
if (theTest2 == '000') {theTest2 = 'z';}
for (var i = 0; i < vDimV; i++) {
	myrow=mytable.getElementsByTagName("tr").item(i);
	for (var v = 0; v < vDimH; v++) {
		mycel=myrow.getElementsByTagName("td").item(v);
		if (mycel.id.substr(5,3) == theTest1) {
			mycel.bgColor = '#ccccff';
		} else {
			if (mycel.id.substr(8,3) == theTest2) {
				mycel.bgColor = '#ccccff';
			} else {
				if (mycel.bgColor == '#ccccff') {mycel.bgColor = '#ffffff';}
			}
		}
	}
}
}

function foc(obj) {
obj.select(); obj.focus();
}


function idefH(code){
var theVal = '';
switch (code)
{
case '001' : theVal = "Gifle";break;
case '005' : theVal = "Pipi";	break;
case '006' : theVal = "Si ce n'est toi, c'est donc ta soeur";	break;
case '008' : theVal = "Coups de poing";break;
}
myDefH.innerHTML = theVal;
}

function idefV(code){
var theVal = '';
switch (code)
{
case '001' : theVal = "Passé du verre dans la bouche";break;
case '002' : theVal = "Pour lancer des flèches";	break;
case '003' : theVal = "Presqu'un phénix";	break;
case '004' : theVal = "Carabosse, par exemple";	break;
case '007' : theVal = "Note";	break;
case '009' : theVal = "Très bien";	break;
}
myDefV.innerHTML = theVal;
}

function icas(objet){
vMots = objet.id;
icolor(vMots);
idefH(objet.id.substr(5,3));
idefV(objet.id.substr(8,3));
imot(5,document.FormJeu.SaisieH);
imot(8,document.FormJeu.SaisieV);
if (vLast == 1) {foc(document.FormJeu.SaisieH);} else {foc(document.FormJeu.SaisieV);}
}

function ichange(motdelta,delta,theVal){
theMax = theVal.length;
for (var i = 0; i < vDimV; i++) {
	myrow=mytable.getElementsByTagName("tr").item(i);
	for (var v = 0; v < vDimH; v++) {
		mycel=myrow.getElementsByTagName("td").item(v);
		if (mycel.id.substr(motdelta,3) == vMots.substr(motdelta,3)) {
			var thePos = Number(mycel.id.substr(delta,2));
			if (thePos <= theMax) {
				var thecar=theVal.charAt(thePos - 1);
				if (thecar==' ') {thecar = '?';} else {thecar = thecar.toUpperCase();}
				mycel.innerHTML = '';
				mycel.innerHTML = thecar;
			}
		}
	}
}
}

function imot(motdelta,objet){
var theMot = '';
var theTest = vMots.substr(motdelta,3);
if (theTest == '000') {
	theMot = '';
} else {
	for (var i = 0; i < vDimV; i++) {
		myrow=mytable.getElementsByTagName("tr").item(i);
		for (var v = 0; v < vDimH; v++) {
			mycel=myrow.getElementsByTagName("td").item(v);
			if (mycel.id.substr(motdelta,3) == theTest) {
				theMot = theMot + mycel.innerHTML;
			}
		}
	}
}
objet.value = theMot;
}

function itrich(motdelta,objet){
var theTest = vMots.substr(motdelta,3);
for (var i = 0; i < vDimV; i++) {
	myrow=mytable.getElementsByTagName("tr").item(i);
	for (var v = 0; v < vDimH; v++) {
		mycel=myrow.getElementsByTagName("td").item(v);
		if (mycel.id.substr(motdelta,3) == theTest) {
			mycel.innerHTML = '';
			mycel.innerHTML = mycel.id.charAt(15);
		}
	}
}
imot(5,document.FormJeu.SaisieH);
imot(8,document.FormJeu.SaisieV);
foc(objet);
}

function isolut(affich){
var oneerr = 0;
for (var i = 0; i < vDimV; i++) {
	myrow=mytable.getElementsByTagName("tr").item(i);
	for (var v = 0; v < vDimH; v++) {
		mycel=myrow.getElementsByTagName("td").item(v);
		var thecar = mycel.id.charAt(15);
		if (thecar != '0') {
			if (mycel.innerHTML != thecar) {
				oneerr = 1;
				mycel.bgColor = '#ffccff';
				if (affich == 2) {mycel.innerHTML = '';	mycel.innerHTML = thecar;}
			} else {mycel.bgColor = '#ffffff';}
		}
	}
}
imot(5,document.FormJeu.SaisieH);
imot(8,document.FormJeu.SaisieV);
foc(document.FormJeu.SaisieH);
vLast = 1;
if (oneerr == 0) {alert("La solution est correcte!");}
}

function isaisieH(){
if (vMots.substr(5,3) != '000') {
	ichange(5,11,document.FormJeu.SaisieH.value);
	imot(8,document.FormJeu.SaisieV)
	vLast = 1;
}
}

function isaisieV(){
if (vMots.substr(8,3) != '000') {
	ichange(8,13,document.FormJeu.SaisieV.value);
	imot(5,document.FormJeu.SaisieH)
	vLast = 2;
}
}
