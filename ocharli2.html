<I>
O Charlie is my darling,
My darling, my darling,
O Charlie is my darling
The young Chevalier.</I>

1. Twas on a monday morning,
Right early in the year,
That Charlie came to our town,
The young Chevalier.
<I>
O Charlie is my darling,
My darling, my darling,
O Charlie is my darling
The young Chevalier.</I>

2. As he came marching up the street,
The pipes played loud and clear
And all the folk came running out
To meet the Chevalier.
<I>
O Charlie is my darling,
My darling, my darling,
O Charlie is my darling
The young Chevalier.</I>

3. With Highland bonnets on their heads
And claymores long and clear
They came to fight for Scotland's right,
And the young Chevalier.
<I>
O Charlie is my darling,
My darling, my darling,
O Charlie is my darling
The young Chevalier.</I>

4. Now haud awa ye lowland lads,
And court nae lasses here,
The Highland men are back again
With the young Chevalier.
<I>
O Charlie is my darling,
My darling, my darling,
O Charlie is my darling
The young Chevalier.</I>

5. It's up on yon heathery mountain,
And down yon scroggy glen,
We daur na gang a milking,
For Charlie and his men.
<I>
O Charlie is my darling,
My darling, my darling,
O Charlie is my darling
The young Chevalier.</I>
</marquee><br>

James Hogg, editor of "The Jacobite Relics of Scotland" (1819/1821) gives us "Charlie is my Darling" from <a href="authors.html#musa">"The Museum"</a> (Volume V N°404, page 440) as “original.” Evidently, he did not know that it was a “vamp” by Burns. He wrote his own version,  "altered at the request of a lady who sang it sweetly" <p>
</center>
<i><b>Excerpts from the critical essay "Gender, Genre and the Imagining of the Scottish Nation: the Songs of Lady Nairne" by Leith Davis<br></b>
<br>
"A number of Jacobite songs fall into a category which was described as "erotic." They depict "the absent king as lover", often from the perspective of the beloved. As a critic suggests, "it is notable how many later Jacobite songs do have a female narrator". Burns' version of "Charlie he's my darling" foregrounds the element of female desire found in many such songs, reinforcing the political transgression by combining it with a depiction of transgressive female behaviour. In other words, Burns' version partakes of the levity of the older ballads. As he is walking up the street, Prince Charles "spie[s] a bonnie lass" looking at him through the window. He bounds up the stairs to reach her, and Burns suggests that she is equally if not more desirous to meet him: "And wha sae ready as hersel/ To let the laddie in". In addition, Charles' seductive effect on the woman is presented in terms which emphasizes her sexual appetite: "For brawlie weel he ken'd the way/ To please a bonie lass". The chorus, "An' Charlie he's my darling, my darling, my darling," further reinforces the woman's perspective and agency in the encounter.<br>
<br>
Many of Lady Nairne's Jacobite songs, like "The Hundred Pipers" and "The Gathering Song," fall into the category: "the aggressive/active song, calling for war or opposition to the Whig state". <br>
<br>
When she writes or rewrites songs that recall the "erotic" category, she revises them to eliminate sexually explicit material. Nairne's version of "Charlie is My Darling," for example, retains the chorus but replaces the sexual attraction between Prince Charles and the individual woman with a more general attraction that the troops have for the townfolk:<br>
<br>
'And a' the folk came running out/ To meet the Chevalier. '<br>
<br>
Burns' version ends with a suggestion that all the Jacobite soldiers are as dangerously attractive as Charles:<br>
<br>
'We daur na gang a milking,/ For Charlie and his men.'<br>
<br>
Nairne, however, depicts the soldiers as faithful husbands and fathers:<br>
<br>
'They've left their bonnie Hieland hills/ Their wives and bairnies dear,/ To draw the sword for Scotland's lord,/ The young Chevalier. "<br>
